# Optional persistent analytics deployment. Adds two 1GB volumes across the
# two current Machines ($0.30/month total storage). Enable after cost approval.
app = 'x402-api'
primary_region = 'nrt'
[build]
[env]
  NODE_ENV = 'production'
  PORT = '4020'
  X402_ANALYTICS_DIR = '/data/analytics'
[[mounts]]
  source = 'analytics'
  destination = '/data'
[http_service]
  internal_port = 4020
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
[[http_service.checks]]
  grace_period = '5s'
  interval = '30s'
  method = 'GET'
  path = '/health'
  timeout = '3s'
[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
